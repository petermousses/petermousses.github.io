<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peter Mousses</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0d1117;
      --fg: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
    }

    main {
      max-width: 36rem;
    }

    h1 {
      font-size: clamp(2.5rem, 8vw, 4rem);
      letter-spacing: -0.03em;
    }

    p {
      margin-top: 1rem;
      color: var(--muted);
      font-size: 1.125rem;
      line-height: 1.6;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main>
    <h1>Hello, world 👋</h1>
    <p>This is a test page for <a href="https://github.com/petermousses">Peter Mousses</a> on GitHub Pages.</p>
  </main>
</body>
</html>
